<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#110e17">
<meta name="description" content="Klingenhort – 16-Bit Hack & Slash im Browser. Kombos, Spezialangriffe, Beute, Bosse.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klingenhort">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Klingenhort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{
  /* Layout: Vollbild-Spielfeld (Canvas), HUD-Leisten oben, Touch-Steuerung unten rechts, Menüs als Steintafeln in der Mitte */
  --night:#110e17; --stone:#241e2e; --stone-hi:#3a3047; --stone-lo:#17121e;
  --parch:#efe2bf; --parch-dim:#a8997e; --gold:#e8b04a; --gold-dk:#9c6a24;
  --blood:#c8463c; --mana:#57a7d6; --moss:#79c24e; --rune:#b892f4;
  --r0:#c8c8c8; --r1:#57a7d6; --r2:#e8d04a; --r3:#b892f4; --r4:#ff8a3a;
  --f-display:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-body:"VT323", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--parch);font-family:var(--f-body);font-size:20px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#game{position:fixed;left:0;top:0;display:block;image-rendering:pixelated}
button{font:inherit;color:inherit}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;font-family:var(--f-display);font-size:9px;z-index:5}
.hud-l{display:flex;gap:10px;align-items:center;min-width:0}
.lv{background:var(--gold);color:var(--night);padding:7px 6px;box-shadow:0 0 0 2px var(--night),0 0 0 3px var(--gold-dk);white-space:nowrap}
.bars{display:grid;gap:5px}
.bar{position:relative;height:14px;width:clamp(110px,30vw,230px);background:var(--stone-lo);box-shadow:0 0 0 2px var(--night),0 0 0 3px var(--parch-dim)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--blood);box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.25);transition:width .12s steps(4)}
.bar.xp,.bar.rage{height:5px}.bar.xp i{background:var(--mana);box-shadow:none}.bar.rage i{background:var(--gold);box-shadow:none}
.bar.rage.full i{background:#fff3c0;animation:pulse .5s steps(2) infinite}
@keyframes pulse{50%{background:var(--gold)}}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:7px;text-shadow:1px 1px 0 #000;font-variant-numeric:tabular-nums}
.hud-r{display:flex;gap:10px;align-items:flex-start;text-align:right}
.hud-r .info{display:grid;gap:6px;justify-items:end;text-shadow:2px 2px 0 #000;white-space:nowrap}
#hudWave{color:var(--parch-dim)}
.coin{display:inline-block;width:8px;height:8px;background:var(--gold);box-shadow:inset -2px -2px 0 var(--gold-dk),0 0 0 1px #000;margin-right:5px;vertical-align:-1px}
#pauseBtn{pointer-events:auto;font-family:var(--f-display);font-size:10px;width:34px;height:34px;background:var(--stone);border:0;box-shadow:0 0 0 2px var(--night),0 0 0 3px var(--parch-dim);cursor:pointer}
#bossbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);width:min(420px,calc(100vw - 48px));font-family:var(--f-display);font-size:8px;text-align:center;pointer-events:none;z-index:5;text-shadow:2px 2px 0 #000}
#bossbar .bar{width:100%;margin-top:6px;height:10px}
#bossbar .bar i{background:linear-gradient(var(--blood),#8a2a24)}
#combo{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 74px);font-family:var(--f-display);text-align:right;pointer-events:none;z-index:5;color:var(--gold);text-shadow:2px 2px 0 #000;opacity:0;transition:opacity .3s}
#combo b{display:block;font-weight:400;font-size:22px;line-height:1}
#combo small{font-size:7px;color:var(--parch)}
#combo.on{opacity:1}
#combo.pop b{animation:pop .18s steps(3)}
@keyframes pop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;z-index:6;opacity:0;padding-inline:16px}
#banner b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(16px,4vw,30px);color:var(--gold);text-shadow:3px 3px 0 #000,-1px -1px 0 #000;text-wrap:balance;line-height:1.4}
#banner small{display:block;margin-top:10px;font-family:var(--f-display);font-size:clamp(8px,1.6vw,11px);color:var(--parch);text-shadow:2px 2px 0 #000}
#banner.show{animation:ban 2s steps(20) forwards}
@keyframes ban{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);font-family:var(--f-display);font-size:9px;background:var(--stone);padding:8px 10px;box-shadow:0 0 0 2px var(--night),0 0 0 3px var(--parch-dim);opacity:0;pointer-events:none;z-index:6;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.show{animation:ban 1.8s steps(14) forwards}
body.touch #toast{bottom:calc(env(safe-area-inset-bottom,0px) + 230px)}
#wtag{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:8px;pointer-events:none;z-index:5;text-shadow:2px 2px 0 #000}
#wtag .slot{width:44px;height:44px;display:grid;place-items:center;background:var(--stone);box-shadow:0 0 0 2px var(--night),0 0 0 3px var(--gold-dk)}
#wtag img,.tb img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated}
#wtag .k{color:var(--parch-dim);display:block;margin-top:6px}
body.touch #wtag{display:none}
#touch{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
body.touch #touch{display:block}
#tzone{position:absolute;left:0;top:70px;bottom:0;width:55%;pointer-events:auto}
#stick{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:rgba(17,14,23,.45);box-shadow:0 0 0 3px rgba(239,226,191,.35);display:none;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(239,226,191,.6);box-shadow:inset -4px -4px 0 rgba(0,0,0,.25)}
#btns{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:200px;height:190px;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border:0;display:grid;place-items:center;font-family:var(--f-display);font-size:7px;color:var(--parch);background:var(--stone);box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--parch-dim),inset -4px -4px 0 rgba(0,0,0,.35);clip-path:polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%);touch-action:none}
.tb.down{transform:translateY(2px);filter:brightness(1.3)}
#bAtk{right:0;bottom:0;width:88px;height:88px;background:var(--blood)}
#bRoll{right:98px;bottom:0;width:58px;height:58px}
#bSpec{right:0;bottom:98px;width:62px;height:62px;--f:0%;background:linear-gradient(to top,var(--gold-dk) var(--f),var(--stone) var(--f));color:var(--parch)}
#bSpec.ready{background:var(--gold);color:var(--night);animation:pulse2 .6s steps(2) infinite}
@keyframes pulse2{50%{filter:brightness(1.25)}}
#bPot{right:104px;bottom:70px;width:48px;height:48px}
#bSwap{right:72px;bottom:140px;width:46px;height:46px}
@media (max-height:440px){#btns{transform:scale(.82);transform-origin:100% 100%}#tzone{top:56px}}
#bPot b{position:absolute;right:5px;bottom:4px;font-weight:400;color:var(--gold)}
#ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,8,14,.7);z-index:10;padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:var(--stone);width:min(580px,100%);max-height:100%;overflow:auto;padding:22px 20px;box-shadow:0 0 0 3px var(--night),0 0 0 6px var(--parch-dim),0 0 0 9px var(--night),0 14px 0 9px rgba(0,0,0,.35);touch-action:pan-y}
.logo{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,7vw,46px);line-height:1.15;margin:4px 0 14px;color:var(--gold);text-shadow:4px 4px 0 var(--blood),8px 8px 0 #000;letter-spacing:2px}
.tag{margin:0 0 18px;font-size:22px;line-height:1.15;color:var(--parch);max-width:46ch}
.menu{display:grid;gap:12px;margin-bottom:18px}
.btn{font-family:var(--f-display);font-size:10px;line-height:1.5;padding:12px 14px;border:0;cursor:pointer;background:var(--gold);color:var(--night);box-shadow:0 0 0 2px var(--night),inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.35);text-align:center}
.btn.alt{background:var(--stone-hi);color:var(--parch)}
.btn.red{background:var(--blood);color:var(--parch)}
.btn:active{transform:translateY(2px)}
.btn:disabled{background:var(--stone-lo);color:var(--parch-dim);cursor:default;box-shadow:0 0 0 2px var(--night);transform:none}
.btn:focus-visible,.tab:focus-visible,#pauseBtn:focus-visible{outline:2px solid var(--parch);outline-offset:3px}
.help{font-size:19px;line-height:1.2;color:var(--parch-dim);border-top:2px dashed var(--stone-hi);padding-top:12px}
.help b{font-family:var(--f-display);font-weight:400;font-size:8px;color:var(--parch);letter-spacing:1px;display:block;margin-bottom:6px}
.credit{margin-top:12px;font-size:16px;color:var(--parch-dim)}
h2{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--gold);margin:0;text-shadow:3px 3px 0 #000}
.shop-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.gold{font-family:var(--f-display);font-size:12px;color:var(--gold);white-space:nowrap}
.sub{margin:10px 0 12px;font-size:20px;color:var(--parch-dim)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.stats span{font-family:var(--f-display);font-size:8px;background:var(--stone-lo);padding:6px 7px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;font-family:var(--f-display);font-size:7px;padding:10px 2px;border:0;background:var(--stone-lo);color:var(--parch-dim);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--stone-hi);color:var(--parch);box-shadow:inset 0 -3px 0 var(--gold)}
.grp{font-family:var(--f-display);font-size:8px;color:var(--gold);margin:14px 0 8px;letter-spacing:1px}
.grp em{font-style:normal;font-family:var(--f-body);font-size:18px;color:var(--parch-dim);letter-spacing:0;margin-left:6px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;background:var(--stone-lo);margin-bottom:5px}
.row.eq{box-shadow:inset 3px 0 0 var(--moss)}
.row.lock{opacity:.55}
.row .ic{width:44px;height:44px;display:grid;place-items:center;background:var(--night)}
.row .ic img{width:38px;height:38px;object-fit:contain;image-rendering:pixelated}
.row .nm{font-size:21px;line-height:1;min-width:0}
.row .st{font-size:17px;color:var(--parch-dim);margin-top:3px}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row .btn{font-size:8px;padding:9px 8px;white-space:nowrap}
.pill{font-family:var(--f-display);font-size:7px;padding:7px 6px;background:var(--moss);color:var(--night);white-space:nowrap}
.list{min-height:120px}
.empty{font-size:19px;color:var(--parch-dim);padding:14px 4px}
.next{width:100%;margin-top:16px;font-size:11px;padding:14px}
.center{text-align:center}
.over h2{color:var(--blood);font-size:22px;margin-bottom:12px}
.kv{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 18px}
@media (prefers-reduced-motion:reduce){#banner.show,#toast.show{animation-duration:2.4s;animation-timing-function:steps(2)}#bSpec.ready,.bar.rage.full i{animation:none}}
#rotate{position:fixed;inset:0;z-index:50;display:none;place-items:center;text-align:center;background:var(--night);padding:24px;font-family:var(--f-display);font-size:11px;line-height:1.8;color:var(--parch)}
#rotate .ph{width:44px;height:76px;margin:0 auto 22px;border:4px solid var(--gold);border-radius:6px;animation:rot 1.6s steps(4) infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){body.touch #rotate{display:grid}}
</style>
</head>
<body>
<div id="rotate"><div><div class="ph"></div>Bitte dein Handy<br>ins Querformat drehen</div></div>

<canvas id="game" aria-label="Spielfeld"></canvas>

<div id="hud" hidden>
  <div class="hud-l">
    <div class="lv" id="hudLv">LV 1</div>
    <div class="bars">
      <div class="bar hp"><i id="hpFill"></i><span id="hpTxt">60/60</span></div>
      <div class="bar xp"><i id="xpFill"></i></div>
      <div class="bar rage" id="rageBar"><i id="rageFill"></i></div>
    </div>
  </div>
  <div class="hud-r">
    <div class="info">
      <div id="hudStage">STUFE 1</div>
      <div id="hudWave">WELLE 1/2</div>
      <div><i class="coin"></i><span id="hudGold">0</span></div>
    </div>
    <button id="pauseBtn" aria-label="Pause">II</button>
  </div>
</div>
<div id="bossbar" hidden><div id="bossName">BOSS</div><div class="bar"><i id="bossFill"></i></div></div>
<div id="combo"><b id="comboN">0</b><small>TREFFER</small></div>
<div id="banner"><b id="banTitle"></b><small id="banSub"></small></div>
<div id="toast"></div>
<div id="wtag" hidden><div class="slot"><img id="wtagImg" alt=""></div><div><span id="wtagName">Kurzschwert</span><span class="k">Q/E Waffe · F <span id="wtagSpec">Spezial</span> · H Trank (<span id="wtagPot">1</span>)</span></div></div>

<div id="touch" hidden>
  <div id="tzone"><div id="stick"><div id="knob"></div></div></div>
  <div id="btns">
    <button class="tb" id="bAtk" aria-label="Angriff"><img id="atkImg" alt=""></button>
    <button class="tb" id="bRoll" aria-label="Ausweichen">ROLLE</button>
    <button class="tb" id="bSpec" aria-label="Spezialangriff">SPEZ</button>
    <button class="tb" id="bSwap" aria-label="Waffe wechseln">WAFFE</button>
    <button class="tb" id="bPot" aria-label="Heiltrank">TRANK<b id="potN">1</b></button>
  </div>
</div>

<div id="ov"><div class="panel" id="panel"><p class="sub">Lade Grafik …</p></div></div>

/* ---------- Helfer ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-(1-t)*(1-t);
const approach=(v,t,d)=>v<t?Math.min(t,v+d):Math.max(t,v-d);
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;if(fn){const g=c.getContext('2d');g.imageSmoothingEnabled=false;fn(g)}return c}
function px(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x|0,y|0,w,h)}
function hexRgb(h){const n=parseInt(h.slice(1,7),16);return[n>>16&255,n>>8&255,n&255]}
function crop(x,y,w,h){return mk(w,h,g=>g.drawImage(SHEET,x,y,w,h,0,0,w,h))}

const keys={},mouse={x:0,y:0,down:false};
const stick={id:null,ox:0,oy:0,x:0,y:0};
let touchAtk=false;
function readInput(){
  let mx=0,my=0;
  if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
  if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;
  if(stick.id!==null){mx+=stick.x;my+=stick.y}
  const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
  return{mx,my,attack:!!(keys.KeyJ||keys.Space||mouse.down||touchAtk)};
}
function autoAim(range,inp){
  let tgt=null,best=range;
  for(const e of enemies){if(e.st==='spawn')continue;const d=Math.hypot(e.x-P.x,e.y-P.y);if(d<best){best=d;tgt=e}}
  if(mouse.down)return Math.atan2(mouse.y/SCALE+CY-(P.y-6),mouse.x/SCALE+CX-P.x);
  if(tgt)return Math.atan2(tgt.y-P.y,tgt.x-P.x);
  if(inp&&Math.hypot(inp.mx,inp.my)>.15)return Math.atan2(inp.my,inp.mx);

}

}

function weaponHit(e,w,mul,nx,ny,kbMul,forceCrit){

function showCode(msg){
  const s=loadSave(),code=s?btoa(unescape(encodeURIComponent(JSON.stringify(s)))):'';
  showOverlay(`<h2>SPIELSTAND</h2><p class="sub">Kopiere den Code auf einem Gerät und füge ihn auf dem anderen ein. So nimmst du deinen Fortschritt mit.</p>
  <div class="grp">DEIN CODE</div><textarea id="codeOut" readonly rows="4" style="width:100%;box-sizing:border-box;font:16px var(--f-body);background:var(--night);color:var(--parch);border:2px solid var(--stone-hi);padding:8px">${code||'Noch kein Spielstand vorhanden.'}</textarea>
  <div class="menu" style="margin-top:8px"><button class="btn alt" data-act="copycode" ${code?'':'disabled'}>Code kopieren</button></div>
  <div class="grp">CODE EINFÜGEN</div><textarea id="codeIn" rows="4" placeholder="Code hier einfügen …" style="width:100%;box-sizing:border-box;font:16px var(--f-body);background:var(--night);color:var(--parch);border:2px solid var(--stone-hi);padding:8px"></textarea>
  ${msg?`<p class="sub" style="color:var(--gold)">${msg}</p>`:''}
  <div class="menu" style="margin-top:8px"><button class="btn" data-act="loadcode">Code laden</button><button class="btn alt" data-act="backtitle">Zurück</button></div>`);
}
let shopTab='w';
function itemInfo(id){
  const[slot,t]=id.split(':'),tier=+t;
  if(WT[slot]){const w=WT[slot];return{id,slot,tier,kind:'w',name:w.names[tier],req:w.req[tier],price:w.price[tier]}}
  const a=AR[slot];return{id,slot,tier,kind:'a',name:a.names[tier],req:a.req[tier],price:a.price[tier],def:a.def[tier],hp:a.hp[tier]};
}
function shopRow(id,owned,equipped){
  const it=itemInfo(id),lock=P.lv<it.req;
  const stat=it.kind==='w'?`SCH ${Math.round(WT[it.slot].dmg*TMUL[it.tier])} · ab LV ${it.req}`:`VER +${it.def}${it.hp?' · LP +'+it.hp:''} · ab LV ${it.req}`;
  let act;
  if(equipped)act='<span class="pill">ANGELEGT</span>';
  else if(owned)act=`<button class="btn alt" data-act="equip" data-id="${id}">Anlegen</button>`;
  else if(lock)act=`<button class="btn" disabled>LV ${it.req}</button>`;
  else act=`<button class="btn" data-act="buy" data-id="${id}" ${P.gold<it.price?'disabled':''}><i class="coin"></i>${it.price}</button>`;
  return`<div class="row ${equipped?'eq':''} ${lock&&!owned?'lock':''}"><div class="ic"><img src="${iconURL(id)}" alt=""></div><div><div class="nm">${it.name}</div><div class="st">${stat}</div></div><div class="acts">${act}</div></div>`;
}
function lootRow(L){
  const eq=P.eqLoot[L.type]===L.id,col=RAR[L.rar].c;
  return`<div class="row ${eq?'eq':''}"><div class="ic" style="box-shadow:inset 0 0 0 2px ${col}"><img src="${iconURL(L.type+':'+L.tier)}" alt=""></div><div><div class="nm" style="color:${col}">${L.name}</div><div class="st">${RAR[L.rar].n} ${WT[L.type].label} · ${lootStats(L)}</div></div><div class="acts">${eq?'<span class="pill">ANGELEGT</span>':`<button class="btn alt" data-act="leq" data-id="${L.id}">Anlegen</button>`}<button class="btn" data-act="lsell" data-id="${L.id}"><i class="coin"></i>${lootPrice(L)}</button></div></div>`;
}
function openShop(){state='shop';showHud(false);$('bossbar').hidden=true;recalc();renderShop()}
function renderShop(){
  const n=P.stage,b=biomeOf(n);let rows='';
  if(shopTab==='w'){for(const t of WORDER){rows+=`<div class="grp">${WT[t].label.toUpperCase()}<em>${WT[t].note} · Spezial: ${WT[t].spec}</em></div>`;for(let i=0;i<5;i++){const id=t+':'+i;rows+=shopRow(id,P.owned.has(id),P.eq[t]===i&&!P.eqLoot[t])}}}
  else if(shopTab==='a'){for(const s of['armor','helm']){rows+=`<div class="grp">${AR[s].label.toUpperCase()}</div>`;for(let i=0;i<5;i++){const id=s+':'+i;rows+=shopRow(id,P.owned.has(id),P.eq[s]===i)}}}
  else if(shopTab==='l'){rows+=`<div class="grp">BEUTE<em>${P.loot.length} / ${LOOT_MAX} – findest du bei Gegnern, Truhen und Bossen</em></div>`;rows+=P.loot.length?P.loot.slice().sort((a,b)=>b.rar-a.rar||b.tier-a.tier).map(lootRow).join(''):'<p class="empty">Noch keine Beute. Elite-Gegner (goldene Krone), Truhen und Bosse lassen Waffen mit Zusatzwerten fallen.</p>'}
  else rows+=`<div class="grp">VORRAT</div><div class="row"><div class="ic"><img src="${iconURL('potion:0')}" alt=""></div><div><div class="nm">Heiltrank</div><div class="st">Heilt 50 % · im Gepäck ${P.potions} / ${POTION_MAX}</div></div><div class="acts"><button class="btn" data-act="potion" ${P.gold<POTION_PRICE||P.potions>=POTION_MAX?'disabled':''}><i class="coin"></i>${POTION_PRICE}</button></div></div>`;
  const tab=(k,l)=>`<button class="tab" role="tab" aria-selected="${shopTab===k}" data-act="tab" data-id="${k}">${l}</button>`;
  showOverlay(`<div class="shop-head"><h2>SCHMIEDE</h2><div class="gold"><i class="coin"></i>${P.gold}</div></div>
  <p class="sub">Stufe ${n-1} geschafft. Als Nächstes: Stufe ${n} – ${b.name}${n%5===0?', mit Boss':''}.</p>
  <div class="stats"><span>LV ${P.lv}</span><span>LP ${P.maxHp}</span><span>VER ${pDef()}</span><span>ANG +${Math.round(pAtk())}</span><span>EP ${P.xp}/${xpNext(P.lv)}</span></div>
  <div class="tabs" role="tablist">${tab('w','WAFFEN')}${tab('a','RÜSTUNG')}${tab('l','BEUTE'+(P.loot.length?' '+P.loot.length:''))}${tab('p','VORRAT')}</div>
  <div class="list">${rows}</div>
  <button class="btn next" data-act="next">Auf zu Stufe ${n} ▸</button>`);
}
function showPause(){
  if(state!=='play')return;state='pause';
  showOverlay(`<h2 class="center">PAUSE</h2><p class="sub center">Stufe ${G.stage} · LV ${P.lv} · ${P.loot.length} Beutestücke</p><div class="menu"><button class="btn" data-act="resume">Weiterspielen</button><button class="btn alt" data-act="music">Musik ${musicOn?'aus':'an'}</button><button class="btn alt" data-act="mute">Ton ${muted?'an':'aus'}</button><button class="btn alt" data-act="title">Zum Titel</button></div><div class="help">${HELP}</div>`);
}
function showOver(){
  state='over';showHud(false);
  const loss=Math.floor(P.gold*.25);
  showOverlay(`<div class="over center"><h2>GEFALLEN</h2><p class="sub">Stufe ${G.stage} war zu viel. Level, Ausrüstung, Beute und Tränke bleiben erhalten.</p>
  <div class="kv"><span class="pill" style="background:var(--stone-hi);color:var(--parch)">LV ${P.lv}</span><span class="pill" style="background:var(--stone-hi);color:var(--parch)">GOLD ${P.gold}</span></div>
  <div class="menu"><button class="btn" data-act="retry">Stufe ${G.stage} erneut (−${loss} Gold)</button><button class="btn alt" data-act="title">Zum Titel</button></div></div>`);
}
function loadInto(s){
  P=newPlayer();
  Object.assign(P,{lv:s.lv,xp:s.xp,gold:s.gold,potions:s.potions,eq:s.eq||{sword:0,armor:0,helm:0},wtype:s.wtype||'sword',stage:s.stage||1,loot:Array.isArray(s.loot)?s.loot:[],eqLoot:s.eqLoot||{},rage:s.rage||0});
  P.owned=new Set(s.owned||['sword:0','armor:0','helm:0']);
  if(P.eq.armor===undefined)P.eq.armor=0;if(P.eq.helm===undefined)P.eq.helm=0;
  if(!hasType(P.wtype))P.wtype=WORDER.find(hasType)||'sword';
  recalc();
}
panel.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;audioOn();
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case'continue':{const s=loadSave();if(s)loadInto(s);else P=newPlayer();startStage(P.stage);break}
    case'new':if(loadSave()){confirmNew=true;showTitle();break}
    /* falls through */
    case'newok':confirmNew=false;clearSave();P=newPlayer();recalc();startStage(1);break;
    case'nocancel':confirmNew=false;showTitle();break;
    case'code':showCode();break;
    case'backtitle':showTitle();break;
    case'copycode':{const t=$('codeOut');const done=()=>{b.textContent='Kopiert'};try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();done()})}catch(_){t.select();done()}break}
    case'loadcode':{try{const raw=$('codeIn').value.trim();const s=JSON.parse(decodeURIComponent(escape(atob(raw))));if(!s||!s.lv)throw 0;localStorage.setItem('klingenhort.v1',JSON.stringify(s));loadInto(s);showCode('Spielstand geladen: Stufe '+(s.stage||1)+' · LV '+s.lv+'. Zurück und „Weiter“ drücken.')}catch(_){showCode('Der Code ist ungültig. Bitte vollständig kopieren und erneut einfügen.')}break}
    case'install':if(window.__doInstall)window.__doInstall();break;
    case'tab':shopTab=id;renderShop();break;
    case'buy':{const it=itemInfo(id);if(P.gold<it.price||P.lv<it.req){sfx('deny');break}P.gold-=it.price;P.owned.add(id);P.eq[it.slot]=it.tier;if(it.kind==='w'){P.wtype=it.slot;delete P.eqLoot[it.slot]}recalc();sfx('buy');save();renderShop();break}
    case'equip':{const it=itemInfo(id);P.eq[it.slot]=it.tier;if(it.kind==='w'){P.wtype=it.slot;delete P.eqLoot[it.slot]}recalc();sfx('swing');save();renderShop();break}
    case'leq':{const L=lootById(id);if(L){P.eqLoot[L.type]=L.id;P.wtype=L.type;sfx('swing');save();renderShop()}break}
    case'lsell':{const L=lootById(id);if(L){P.gold+=lootPrice(L);P.loot=P.loot.filter(x=>x.id!==id);if(P.eqLoot[L.type]===id){delete P.eqLoot[L.type];if(!hasType(P.wtype))P.wtype=WORDER.find(hasType)||'sword'}sfx('coin');save();renderShop()}break}
    case'potion':if(P.gold>=POTION_PRICE&&P.potions<POTION_MAX){P.gold-=POTION_PRICE;P.potions++;sfx('buy');save();renderShop()}break;
    case'next':startStage(P.stage);break;
    case'resume':state='play';hideOverlay();break;
    case'mute':muted=!muted;if(!muted)audioOn();state='play';showPause();break;
    case'music':musicOn=!musicOn;state='play';showPause();break;
    case'title':save();resetTitleScene();showTitle();break;
    case'retry':P.gold-=Math.floor(P.gold*.25);startStage(G.stage);break;
  }
});

/* ---------- Eingabe ---------- */
addEventListener('keydown',e=>{
  if(e.repeat&&!['KeyW','KeyA','KeyS','KeyD'].includes(e.code)&&!e.code.startsWith('Arrow')){keys[e.code]=true;return}
  keys[e.code]=true;audioOn();
  if(state==='play'&&(e.code==='Space'||e.code.startsWith('Arrow')))e.preventDefault();
  if(state==='play'){
    if(e.code==='KeyK'||e.code==='ShiftLeft'||e.code==='ShiftRight')doRoll();
    else if(e.code==='KeyF'||e.code==='KeyL')doSpecial();
    else if(e.code==='KeyQ')swapWeapon(-1);
    else if(e.code==='KeyE')swapWeapon(1);
    else if(e.code==='KeyH')drinkPotion();
    else if(e.code==='Escape'||e.code==='KeyP')showPause();
  }else if(state==='pause'&&(e.code==='Escape'||e.code==='KeyP')){state='play';hideOverlay()}
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;touchAtk=false;if(state==='play')showPause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')showPause()});
cv.addEventListener('mousedown',e=>{audioOn();mouse.x=e.clientX;mouse.y=e.clientY;if(e.button===0)mouse.down=true;else if(e.button===2)doRoll();else if(e.button===1)doSpecial()});
addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false});
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
cv.addEventListener('contextmenu',e=>e.preventDefault());
const tz=$('tzone'),stickEl=$('stick'),knob=$('knob');
tz.addEventListener('pointerdown',e=>{if(stick.id!==null)return;audioOn();stick.id=e.pointerId;stick.ox=e.clientX;stick.oy=e.clientY;stick.x=stick.y=0;try{tz.setPointerCapture(e.pointerId)}catch(_){}stickEl.style.display='block';stickEl.style.left=e.clientX+'px';stickEl.style.top=e.clientY+'px';knob.style.transform='translate(0,0)'});
tz.addEventListener('pointermove',e=>{if(e.pointerId!==stick.id)return;let dx=e.clientX-stick.ox,dy=e.clientY-stick.oy;const l=Math.hypot(dx,dy),m=40;if(l>m){dx=dx/l*m;dy=dy/l*m}stick.x=dx/m;stick.y=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`});
const endStick=e=>{if(e.pointerId!==stick.id)return;stick.id=null;stick.x=stick.y=0;stickEl.style.display='none'};
tz.addEventListener('pointerup',endStick);tz.addEventListener('pointercancel',endStick);
function holdBtn(el,down,up){el.addEventListener('pointerdown',e=>{e.preventDefault();audioOn();el.classList.add('down');try{el.setPointerCapture(e.pointerId)}catch(_){}down()});const u=()=>{el.classList.remove('down');if(up)up()};el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u);el.addEventListener('lostpointercapture',u)}
holdBtn($('bAtk'),()=>{touchAtk=true},()=>{touchAtk=false});
holdBtn($('bRoll'),doRoll);holdBtn($('bSpec'),doSpecial);holdBtn($('bSwap'),()=>swapWeapon(1));holdBtn($('bPot'),drinkPotion);
$('pauseBtn').addEventListener('click',()=>{audioOn();showPause()});

/* ---------- Schleife ---------- */
function resize(){
  const w=innerWidth,h=innerHeight;
  SCALE=Math.max(2,Math.round(Math.min(w,h)/215));
  VW=Math.ceil(w/SCALE);VH=Math.ceil(h/SCALE);
  cv.width=VW;cv.height=VH;cv.style.width=VW*SCALE+'px';cv.style.height=VH*SCALE+'px';
  ctx.imageSmoothingEnabled=false;makeVig();
}
addEventListener('resize',resize);
let last=performance.now();
function update(dt){
  updPlayer(dt);
  for(const e of enemies)if(!e.dead)updEnemy(e,dt);
  separate();
  enemies=enemies.filter(e=>!e.dead);
  updProjs(dt);updSpikes();updPickups(dt);updParts(dt);ambient(dt);
  if(state==='play')updWaves(dt);
  if(state==='dead'){deadT-=dt;if(deadT<=0)showOver()}
}
function camera(dt){
  const tx=AW<=VW?(AW-VW)/2:clamp(P.x-VW/2,0,AW-VW),ty=AH<=VH?(AH-VH)/2:clamp(P.y-10-VH/2,0,AH-VH);
  const k=1-Math.pow(.0005,dt);cam.x=lerp(cam.x,tx,k);cam.y=lerp(cam.y,ty,k);
  shk.m*=Math.pow(.002,dt);shk.x=rnd(-shk.m,shk.m);shk.y=rnd(-shk.m,shk.m);if(shk.m<.2)shk.m=shk.x=shk.y=0;
}
function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  if(slowmo>0){slowmo-=dt;dt*=.35}
  flash.a=Math.max(0,flash.a-dt*1.6);
  if(state==='play'&&isTouch&&innerHeight>innerWidth&&$('rotate'))showPause();
  if(state==='play'||state==='dead'){if(hitStop>0)hitStop-=dt;else update(dt)}
  else if(state==='title'){P.moving=false;P.turn=approach(P.turn,Math.sin(T*.4)>0?1:-1,dt*3);P.face=P.turn>0?1:-1;updParts(dt);ambient(dt)}
  if(P&&bg){camera(dt);if(state==='play')updHud()}
  render();
}
SHEET.onload=()=>{
  GHOST=mk(144,28,g=>{g.drawImage(SHEET,128,100,144,28,0,0,144,28);g.globalCompositeOperation='source-in';g.fillStyle='#8ee6ff';g.fillRect(0,0,144,28)});
  resize();
  const s=loadSave();if(s)loadInto(s);else{P=newPlayer();recalc()}
  resetTitleScene();showTitle();
  if(document.fonts&&document.fonts.load)document.fonts.load('8px "Press Start 2P"').catch(()=>{});
  requestAnimationFrame(loop);
};
SHEET.onerror=()=>{panel.innerHTML='<p class="sub">Die Grafik konnte nicht geladen werden. Bitte Seite neu laden.</p>'};
})();
</script>
<script>
(()=>{
  if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  let deferred=null;
  const standalone=matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
  window.__installBtn=()=>{if(standalone)return'';if(deferred)return'<button class="btn" data-act="install" style="width:100%;margin-bottom:16px">Als App installieren</button>';if(ios)return'<p class="help" style="border:0;padding:0 0 14px">Als App: in Safari auf <b style="display:inline;font-size:8px">TEILEN</b> und dann „Zum Home-Bildschirm“ tippen.</p>';return''};
  window.__doInstall=async()=>{if(!deferred)return;deferred.prompt();try{await deferred.userChoice}catch(_){}deferred=null};
  const goLand=()=>{if(!('ontouchstart' in window))return;const el=document.documentElement;const lock=()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(_){}};
    if(!standalone&&!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen({navigationUI:'hide'}).then(lock).catch(()=>{});else lock()};
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-act=continue],[data-act=new],[data-act=newok],[data-act=next],[data-act=retry]');if(b)goLand()},true);
})();
</script>
