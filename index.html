<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Klingenhort</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#110e17">
<meta name="description" content="Klingenhort – 16-Bit Hack & Slash im Browser. Vier Klassen, frei gestaltbare Helden, ausbaubares Versteck, Verschmelzen, Glückstempel, 8 Akte Geschichte und endlose Qual-Stufen.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klingenhort">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{
  /* Layout: Vollbild-Spielfeld, HUD oben, Fähigkeiten unten, Menüs als Steintafeln */
  --night:#110e17; --stone:#241e2e; --stone-hi:#3a3047; --stone-lo:#17121e;
  --parch:#efe2bf; --parch-dim:#a8997e; --gold:#e8b04a; --gold-dk:#9c6a24;
  --blood:#c8463c; --mana:#57a7d6; --moss:#79c24e; --rune:#b892f4;
  --f-display:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-body:"VT323", ui-monospace, "Courier New", monospace;
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px); --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--parch);font-family:var(--f-body);font-size:20px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#game{position:fixed;left:0;top:0;display:block;image-rendering:pixelated;will-change:transform}
button{font:inherit;color:inherit}
img.px{image-rendering:pixelated}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;font-family:var(--f-display);font-size:9px;z-index:5}
.hud-l{display:flex;gap:8px;align-items:center;min-width:0}
.lv{background:var(--gold);color:var(--night);padding:7px 6px;box-shadow:0 0 0 2px var(--night),0 0 0 3px var(--gold-dk);white-space:nowrap}
.lv.hc{background:var(--blood);color:var(--parch)}
.bars{display:grid;gap:4px}
.bar{position:relative;height:13px;width:clamp(110px,28vw,230px);background:var(--stone-lo);box-shadow:0 0 0 2px var(--night),0 0 0 3px var(--parch-dim)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--blood);box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.25);transition:width .12s steps(4)}
.bar.res{height:6px}.bar.res i{background:var(--mana);box-shadow:none}
.bar.xp,.bar.rage{height:4px}.bar.xp i{background:#8a7ad8;box-shadow:none}.bar.rage i{background:var(--gold);box-shadow:none}
.bar.rage.full i{background:#fff3c0;animation:pulse .5s steps(2) infinite}
@keyframes pulse{50%{background:var(--gold)}}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:7px;text-shadow:1px 1px 0 #000;font-variant-numeric:tabular-nums}
.hud-r{display:flex;gap:10px;align-items:flex-start;text-align:right}
.hud-r .info{display:grid;gap:5px;justify-items:end;text-shadow:2px 2px 0 #000;white-space:nowrap}
#hudRoom{color:var(--parch-dim)}
.fc{display:inline-block;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c0,#ffd24a 45%,#c8902a);box-shadow:0 0 0 1px #000;margin-right:4px;vertical-align:-1px}
.coin{display:inline-block;width:8px;height:8px;background:var(--gold);box-shadow:inset -2px -2px 0 var(--gold-dk),0 0 0 1px #000;margin-right:5px;vertical-align:-1px}
#pauseBtn{pointer-events:auto;font-family:var(--f-display);font-size:10px;width:34px;height:34px;background:var(--stone);border:0;box-shadow:0 0 0 2px var(--night),0 0 0 3px var(--parch-dim);cursor:pointer}
#objective{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 50px);font-family:var(--f-display);font-size:10px;color:var(--gold);text-shadow:2px 2px 0 #000;pointer-events:none;z-index:5;white-space:nowrap}
#bossbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 66px);width:min(420px,calc(100vw - 48px));font-family:var(--f-display);font-size:8px;text-align:center;pointer-events:none;z-index:5;text-shadow:2px 2px 0 #000}
#bossbar .bar{width:100%;margin-top:6px;height:10px}
#bossbar .bar i{background:linear-gradient(var(--blood),#8a2a24)}
#combo{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 74px);font-family:var(--f-display);text-align:right;pointer-events:none;z-index:5;color:var(--gold);text-shadow:2px 2px 0 #000;opacity:0;transition:opacity .3s}
#combo b{display:block;font-weight:400;font-size:22px;line-height:1}
#combo small{font-size:7px;color:var(--parch)}
#combo.on{opacity:1}
#combo.pop b{animation:pop .18s steps(3)}
@keyframes pop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;z-index:6;opacity:0;padding-inline:16px}
#banner b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(16px,4vw,30px);color:var(--gold);text-shadow:3px 3px 0 #000,-1px -1px 0 #000;text-wrap:balance;line-height:1.4}
#banner small{display:block;margin-top:10px;font-family:var(--f-display);font-size:clamp(8px,1.6vw,11px);color:var(--parch);text-shadow:2px 2px 0 #000;text-wrap:balance}
#banner.show{animation:ban 2.2s steps(20) forwards}
@keyframes ban{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);font-family:var(--f-display);font-size:9px;background:var(--stone);padding:8px 10px;box-shadow:0 0 0 2px var(--night),0 0 0 3px var(--parch-dim);opacity:0;pointer-events:none;z-index:12;width:max-content;max-width:calc(100vw - 52px);text-align:center;line-height:1.6}
#toast.show{animation:tst 2s steps(14) forwards}
@keyframes tst{0%{opacity:0;transform:translate(-50%,8px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
body.touch #toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 96px)}
#toast.low,body.touch #toast.low{top:calc(env(safe-area-inset-top,0px) + 6px);bottom:auto}
/* Fähigkeitenleiste (PC) */
#skillbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:8px;z-index:5;pointer-events:none}
body.touch #skillbar{display:none}
.sk{position:relative;width:44px;height:44px;background:var(--stone);box-shadow:0 0 0 2px var(--night),0 0 0 3px var(--parch-dim);display:grid;place-items:center}
.sk img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated}
.sk .cdv{position:absolute;inset:0;background:conic-gradient(rgba(10,8,14,.78) var(--cd,0%),transparent 0);}
.sk .k{position:absolute;left:2px;top:2px;font-family:var(--f-display);font-size:7px;text-shadow:1px 1px 0 #000}
.sk .c{position:absolute;right:2px;bottom:2px;font-family:var(--f-display);font-size:6px;color:var(--mana);text-shadow:1px 1px 0 #000}
.sk.ult{box-shadow:0 0 0 2px var(--night),0 0 0 3px var(--gold-dk)}
.sk.ult.ready{box-shadow:0 0 0 2px var(--night),0 0 0 3px var(--gold);animation:pulse2 .6s steps(2) infinite}
.sk.nores{filter:grayscale(.8) brightness(.7)}
@keyframes pulse2{50%{filter:brightness(1.35)}}
/* Touch: Knöpfe werden von js/controls.js frei platziert */
#touch{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
body.touch #touch,body.edit #touch{display:block}
#tzone{position:absolute;left:0;top:64px;bottom:0;width:46%;pointer-events:auto;touch-action:none}
#stick{position:fixed;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:rgba(17,14,23,.42);box-shadow:0 0 0 3px rgba(239,226,191,.32);display:none;pointer-events:none;z-index:5}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(239,226,191,.62);box-shadow:inset -4px -4px 0 rgba(0,0,0,.25)}
#stickHome{position:fixed;border-radius:50%;background:rgba(17,14,23,.3);box-shadow:0 0 0 2px rgba(239,226,191,.22);pointer-events:auto;display:none;touch-action:none}
#stickHome.on{display:block}
#btns{position:fixed;inset:0;pointer-events:none}
.tb{position:fixed;pointer-events:auto;border:0;display:grid;place-items:center;font-family:var(--f-display);font-size:7px;color:var(--parch);background:var(--stone);box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--parch-dim),inset -4px -4px 0 rgba(0,0,0,.35);clip-path:polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%);touch-action:none;overflow:hidden;padding:0;width:52px;height:52px}
.tb img{width:calc(var(--s,52px) * .56);height:calc(var(--s,52px) * .56);object-fit:contain;image-rendering:pixelated;position:relative;z-index:1}
.tb .cdv{position:absolute;inset:0;background:conic-gradient(rgba(10,8,14,.78) var(--cd,0%),transparent 0);z-index:2}
.tb.down{transform:translateY(2px);filter:brightness(1.3)}
.tb.nores{filter:grayscale(.8) brightness(.7)}
#bAtk{background:var(--blood)}
#bAtk img{width:calc(var(--s,88px) * .46);height:calc(var(--s,88px) * .46)}
#bRoll{font-size:calc(var(--s,56px) * .13)}
#bUlt{--f:0%;background:linear-gradient(to top,var(--gold-dk) var(--f),var(--stone) var(--f))}
#bUlt.ready{background:var(--gold);animation:pulse2 .6s steps(2) infinite}
#bPot b{position:absolute;right:4px;bottom:3px;font-weight:400;color:var(--gold);z-index:3}
#bPot.hold::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--h,0%);background:rgba(121,194,78,.55);z-index:2}
#bAct{background:var(--gold-dk);animation:pulse2 .8s steps(2) infinite}
#bAct img{width:calc(var(--s,64px) * .6);height:calc(var(--s,64px) * .6)}
/* Steuerungs-Editor */
body.edit .tb,body.edit #stickHome{outline:2px dashed rgba(239,226,191,.6);outline-offset:3px;cursor:move;display:grid!important;animation:none;clip-path:none}
body.edit .tb.sel,body.edit #stickHome.sel{outline:3px solid var(--gold)}
body.edit #tzone{background:rgba(87,167,214,.08);box-shadow:inset 0 0 0 2px rgba(87,167,214,.25)}
body.edit #game{filter:brightness(.55)}
#ctlbar{position:fixed;left:50%;top:calc(var(--sat) + 8px);transform:translateX(-50%);z-index:20;background:var(--stone);box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--parch-dim);padding:6px 8px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;max-width:calc(100vw - 32px);font-family:var(--f-display);font-size:7px}
#ctlbar b{color:var(--gold);font-weight:400}
#ctlbar .grp{display:inline-flex;gap:4px;align-items:center}
#ctlbar i{font-style:normal;min-width:28px;text-align:center}
#ctlbar button{font-family:var(--f-display);font-size:7px;padding:6px 7px;border:0;background:var(--stone-hi);color:var(--parch);cursor:pointer}
#ctlbar button.ok{background:var(--gold);color:var(--night)}
#ctlbar small{flex-basis:100%;text-align:center;font-family:var(--f-body);font-size:15px;color:var(--parch-dim)}
/* Overlay & Tafeln */
#ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,8,14,.72);z-index:10;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{--pt:20px;--px:18px;background:var(--stone);width:min(620px,100%);max-height:100%;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:var(--pt) var(--px);box-shadow:0 0 0 3px var(--night),0 0 0 6px var(--parch-dim),0 0 0 9px var(--night),0 14px 0 9px rgba(0,0,0,.35);touch-action:pan-y;box-sizing:border-box}
.panel.wide{width:min(900px,100%)}
.logo{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,7vw,46px);line-height:1.15;margin:4px 0 12px;color:var(--gold);text-shadow:4px 4px 0 var(--blood),8px 8px 0 #000;letter-spacing:2px}
.tag{margin:0 0 16px;font-size:21px;line-height:1.15;color:var(--parch);max-width:52ch}
.menu{display:grid;gap:10px;margin-bottom:14px}
.menu.two{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.btn{font-family:var(--f-display);font-size:10px;line-height:1.5;padding:11px 12px;border:0;cursor:pointer;background:var(--gold);color:var(--night);box-shadow:0 0 0 2px var(--night),inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.35);text-align:center}
.btn.alt{background:var(--stone-hi);color:var(--parch)}
.btn.red{background:var(--blood);color:var(--parch)}
.btn.sm{font-size:8px;padding:8px 8px}
.btn:active{transform:translateY(2px)}
.btn:disabled{background:var(--stone-lo);color:var(--parch-dim);cursor:default;box-shadow:0 0 0 2px var(--night);transform:none}
.btn:focus-visible,.tab:focus-visible,#pauseBtn:focus-visible,.node:focus-visible,.cls:focus-visible{outline:2px solid var(--parch);outline-offset:3px}
.help{font-size:18px;line-height:1.2;color:var(--parch-dim);border-top:2px dashed var(--stone-hi);padding-top:10px}
.help b{font-family:var(--f-display);font-weight:400;font-size:8px;color:var(--parch);letter-spacing:1px;display:block;margin-bottom:6px}
.credit{margin-top:10px;font-size:15px;color:var(--parch-dim)}
h2{font-family:var(--f-display);font-weight:400;font-size:16px;line-height:1.35;color:var(--gold);margin:0;text-shadow:3px 3px 0 #000}
h3{font-family:var(--f-display);font-weight:400;font-size:9px;color:var(--gold);margin:14px 0 8px;letter-spacing:1px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.gold{font-family:var(--f-display);font-size:11px;color:var(--gold);white-space:nowrap}
.sub{margin:8px 0 10px;font-size:19px;color:var(--parch-dim)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.stats span{font-family:var(--f-display);font-size:7px;background:var(--stone-lo);padding:6px 6px}
.tabs{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.tab{flex:1;font-family:var(--f-display);font-size:7px;padding:10px 4px;border:0;background:var(--stone-lo);color:var(--parch-dim);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--stone-hi);color:var(--parch);box-shadow:inset 0 -3px 0 var(--gold)}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;background:var(--stone-lo);margin-bottom:5px;border:0;width:100%;text-align:left;color:inherit;cursor:pointer;box-sizing:border-box}
.row.sel{box-shadow:inset 0 0 0 2px var(--gold)}
.row.eq{box-shadow:inset 3px 0 0 var(--moss)}
.row .ic{width:44px;height:44px;display:grid;place-items:center;background:var(--night)}
.row .ic img{width:36px;height:36px;object-fit:contain;image-rendering:pixelated}
.row .nm{font-size:20px;line-height:1;min-width:0}
.row .st{font-size:16px;color:var(--parch-dim);margin-top:3px;line-height:1.05}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-family:var(--f-display);font-size:7px;padding:6px 6px;background:var(--moss);color:var(--night);white-space:nowrap}
.pill.hc{background:var(--blood);color:var(--parch)}
.pill.dim{background:var(--stone-hi);color:var(--parch)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.slot{position:relative;aspect-ratio:1;max-width:100%;background:var(--stone-lo);border:0;display:grid;place-items:center;cursor:pointer;padding:0}
.slot img{width:70%;height:70%;object-fit:contain;image-rendering:pixelated}
.slot .n{position:absolute;right:3px;bottom:2px;font-family:var(--f-display);font-size:7px;text-shadow:1px 1px 0 #000}
.slot .u{position:absolute;left:3px;top:2px;font-family:var(--f-display);font-size:6px;color:var(--gold);text-shadow:1px 1px 0 #000}
.gearslot{text-align:center}
.gearslot .slot{width:60px;height:60px;margin:4px auto 0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.box{background:var(--stone-lo);padding:10px;min-width:0}
.detail{background:var(--night);padding:10px 12px;margin:8px 0;box-shadow:inset 0 0 0 2px var(--stone-hi)}
.detail .nm{font-size:22px}
.detail ul{margin:6px 0;padding-left:18px;font-size:17px;color:var(--parch)}
.cost{display:flex;flex-wrap:wrap;gap:8px;font-size:18px;margin:6px 0}
.cost span{display:inline-flex;align-items:center;gap:3px}
.cost span.bad{color:var(--blood)}
.cost img{width:16px;height:16px;image-rendering:pixelated}
/* Talente */
.tree{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.branch h4{font-family:var(--f-display);font-weight:400;font-size:8px;text-align:center;margin:0 0 8px;color:var(--parch)}
.tal{display:block;width:100%;text-align:left;border:0;background:var(--stone-lo);color:var(--parch);padding:8px;margin-bottom:6px;cursor:pointer;font-family:var(--f-body)}
.tal b{display:block;font-family:var(--f-display);font-weight:400;font-size:7px;line-height:1.5;margin-bottom:3px}
.tal small{display:block;font-size:15px;color:var(--parch-dim);line-height:1.05}
.tal .r{float:right;font-family:var(--f-display);font-size:7px;color:var(--gold)}
.tal.lock{opacity:.4}
.tal.can{box-shadow:inset 0 0 0 2px var(--gold)}
.tal.max{box-shadow:inset 0 0 0 2px var(--moss)}
/* Klassenwahl */
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.cls{border:0;background:var(--stone-lo);color:var(--parch);padding:10px 6px;cursor:pointer;text-align:center;font-family:var(--f-body)}
.cls.sel{box-shadow:inset 0 0 0 3px var(--gold);background:var(--stone-hi)}
.cls b{display:block;font-family:var(--f-display);font-weight:400;font-size:8px;margin-top:6px}
.cls small{display:block;font-size:15px;color:var(--parch-dim);margin-top:4px;line-height:1.05}
.spr{display:block;margin:0 auto;image-rendering:pixelated;background-repeat:no-repeat}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.opt{flex:1;border:0;background:var(--stone-lo);color:var(--parch);padding:9px 6px;cursor:pointer;font-family:var(--f-display);font-size:8px;min-width:90px}
.opt small{display:block;font-family:var(--f-body);font-size:15px;color:var(--parch-dim);margin-top:4px}
.opts.langs .opt{flex:1 1 40%;font-size:10px;min-height:52px}
.langbtn{float:right;margin:0 0 8px 10px}
.opt.sel{box-shadow:inset 0 0 0 3px var(--gold);background:var(--stone-hi)}
input[type=text]{font:20px var(--f-body);background:var(--night);color:var(--parch);border:2px solid var(--stone-hi);padding:8px;width:100%;box-sizing:border-box}
textarea{width:100%;box-sizing:border-box;font:16px var(--f-body);background:var(--night);color:var(--parch);border:2px solid var(--stone-hi);padding:8px}
/* Weltkarte */
.mapwrap{position:relative;width:100%;height:clamp(210px,52vh,340px);background:var(--stone-lo);margin:6px 0 10px;overflow:hidden;box-shadow:0 0 0 2px var(--night)}
.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.node{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border:0;padding:0;background:radial-gradient(circle at 35% 30%,var(--stone-hi),var(--stone) 60%,var(--stone-lo));border-radius:50%;box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--c,#666),0 3px 0 4px rgba(0,0,0,.4);display:grid;place-items:center;cursor:default}
.node img{width:24px;height:24px;object-fit:contain;image-rendering:pixelated}
.node.boss{width:50px;height:50px;margin:-25px 0 0 -25px;box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--blood),0 0 18px 4px rgba(200,70,60,.55)}
.node.boss img{width:34px;height:34px}
.node.av{cursor:pointer;animation:pulse2 .8s steps(2) infinite;box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--c),0 0 14px 3px var(--c)}
.node.done{opacity:.5;filter:grayscale(.6)}
.node.cur{box-shadow:0 0 0 2px var(--night),0 0 0 4px #fff,0 0 14px 4px rgba(255,255,255,.4)}
.node.sel{transform:scale(1.15)}
.node.dim{opacity:.72}
.node.fog{opacity:.38;filter:blur(.4px) grayscale(.5)}
.mapwrap .hero{position:absolute;transform:translate(-50%,-112%);pointer-events:none;z-index:2;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6));animation:bob 1s steps(2) infinite}
@keyframes bob{50%{margin-top:-2px}}
details.legend{font-size:15px;color:var(--parch-dim)}
details.legend summary{cursor:pointer;font-family:var(--f-display);font-size:8px;color:var(--parch);margin-bottom:6px}
details.legend div{display:flex;flex-wrap:wrap;gap:8px}
details.legend span{display:inline-flex;align-items:center;gap:4px}
details.legend img{width:16px;height:16px;image-rendering:pixelated;object-fit:contain}
/* Dialoge & Gespräche */
.dlg{display:flex;gap:12px;align-items:flex-start;background:var(--night);padding:12px;margin:8px 0 12px;box-shadow:inset 0 0 0 2px var(--stone-hi)}
.dlg img{width:48px;height:auto;flex:none;image-rendering:pixelated}
.dlg b{display:block;font-family:var(--f-display);font-weight:400;font-size:9px;margin-bottom:6px}
.dlg p{margin:0;font-size:21px;line-height:1.15}
.say{display:flex;gap:10px;align-items:center;background:var(--stone-lo);padding:8px 10px;margin:0 0 10px;font-size:18px;line-height:1.1}
.say img{width:32px;height:auto;flex:none;image-rendering:pixelated}
.say b{display:block;font-family:var(--f-display);font-weight:400;font-size:7px;margin-bottom:3px}
/* Glücksrad */
.wheel{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:5px;margin:8px 0 12px}
.roll{position:relative;overflow:hidden;height:100px;margin:6px 0 6px;background:#0c0a12;box-shadow:inset 0 0 0 2px var(--stone-lo),inset 0 0 26px #000;cursor:pointer}
.roll .strip{display:flex;gap:4px;position:absolute;left:0;top:9px;will-change:transform}
.roll .tile{box-sizing:border-box;flex:0 0 72px;height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:inset 0 -4px 0 var(--c),inset 0 0 0 1px #2a2434;font-family:var(--f-display);font-size:6px;line-height:1.3;color:var(--parch);text-align:center;padding:0 3px}
.roll .tile img{width:36px;height:36px;image-rendering:pixelated;object-fit:contain}
.roll .tile.win{box-shadow:inset 0 -4px 0 var(--c),inset 0 0 0 2px var(--c),0 0 14px var(--c);animation:rollwin .5s steps(2) 4}
@keyframes rollwin{50%{filter:brightness(1.6)}}
.roll .mark{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--gold);box-shadow:0 0 8px var(--gold);z-index:2;pointer-events:none}
.roll .mark:before,.roll .mark:after{content:'';position:absolute;left:-6px;border:7px solid transparent}
.roll .mark:before{top:0;border-top-color:var(--gold)}
.roll .mark:after{bottom:0;border-bottom-color:var(--gold)}
.roll:before,.roll:after{content:'';position:absolute;top:0;bottom:0;width:40px;z-index:1;pointer-events:none}
.roll:before{left:0;background:linear-gradient(90deg,#0c0a12,transparent)}
.roll:after{right:0;background:linear-gradient(-90deg,#0c0a12,transparent)}
.odds{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px}
.odds span{font-size:14px;color:var(--parch-dim);background:var(--stone-lo);padding:2px 6px;box-shadow:inset 3px 0 0 var(--c)}
.odds b{color:var(--parch);font-weight:400}
.rollres{animation:ban 0.4s steps(4)}
.wheel span{background:var(--stone-lo);padding:7px 6px;font-family:var(--f-display);font-size:7px;line-height:1.4;box-shadow:inset 3px 0 0 var(--c);color:var(--parch)}
.wheel span small{display:block;font-family:var(--f-body);font-size:14px;color:var(--parch-dim)}
.wheel span.on{background:var(--c);color:var(--night);transform:scale(1.06)}
.wheel span.on small{color:var(--night)}
/* Aussehen */
.lookwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:560px){.lookwrap{grid-template-columns:1fr}}
.lookprev{display:grid;gap:8px;justify-items:center;background:radial-gradient(circle,var(--stone-hi),var(--stone-lo));padding:10px;min-width:150px}
.lookopts h3{margin-top:6px}
.bodies{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:5px}
.bd{border:0;background:var(--stone-lo);color:var(--parch);padding:5px 2px;cursor:pointer;display:grid;justify-items:center;gap:2px}
.bd img{height:34px;width:auto;image-rendering:pixelated}
.bd small{font-size:13px;color:var(--parch-dim)}
.bd.sel{box-shadow:inset 0 0 0 2px var(--gold);background:var(--stone-hi)}
.sws{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.sw{width:28px;height:28px;border:0;cursor:pointer;box-shadow:0 0 0 2px var(--night);color:var(--parch-dim);font-size:16px;padding:0}
.sw.sel{box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--gold)}
.row .ic.big,.detail .ic.big{width:48px;height:48px;flex:none;display:grid;place-items:center;background:var(--stone-lo)}
.detail .ic.big img{width:40px;height:40px;object-fit:contain;image-rendering:pixelated}
.cardrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--stone-lo);padding:8px;margin-bottom:6px}
.center{text-align:center}
.over h2{color:var(--blood);font-size:20px;margin-bottom:10px}
.kv{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.achv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.ach{background:var(--stone-lo);padding:8px;opacity:.5}
.ach.on{opacity:1;box-shadow:inset 3px 0 0 var(--gold)}
.ach b{display:block;font-family:var(--f-display);font-weight:400;font-size:7px;margin-bottom:4px}
.ach small{font-size:15px;color:var(--parch-dim)}
@media (prefers-reduced-motion:reduce){#banner.show,#toast.show{animation-duration:2.4s;animation-timing-function:steps(2)}#bUlt.ready,.sk.ult.ready,.node.av,.bar.rage.full i{animation:none}}
/* ---------- Handy: klebende Kopf- und Fußleisten, kompakte Tafeln ---------- */
.panel>.head:first-child{position:sticky;top:calc(6px - var(--pt));z-index:4;background:var(--stone);margin:calc(-1 * var(--pt)) calc(-1 * var(--px)) 8px;padding:var(--pt) var(--px) 8px;box-shadow:0 3px 0 var(--stone-lo)}
.panel>.foot{position:sticky;bottom:calc(6px - var(--pt));z-index:4;background:var(--stone);margin:12px calc(-1 * var(--px)) calc(-1 * var(--pt));padding:10px var(--px) var(--pt);box-shadow:0 -3px 0 var(--stone-lo)}
.foot.row{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
@media (max-width:560px){.foot.row .wide{grid-column:1/-1}}
.legend.open{display:flex;flex-wrap:wrap;gap:8px;font-size:16px;color:var(--parch-dim)}
.legend.open span{display:inline-flex;align-items:center;gap:4px}
.legend.open img{width:16px;height:16px;image-rendering:pixelated;object-fit:contain}
.head .hbtns{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}
/* Liste links, Details rechts (Charakter, Werkbank, Schatzkammer) */
.split{display:grid;gap:10px;align-items:start}
.split>*{min-width:0}
.side .detail:first-child{margin-top:0}
.sheetx{float:right;margin:-2px 0 4px 8px}
.x{font-family:var(--f-body);font-size:26px;line-height:.6;vertical-align:-3px}
@media (min-width:600px){
  .split{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .split>.side{position:sticky;top:var(--stt,0px);max-height:var(--sth,none);overflow:auto;overscroll-behavior:contain}
  .sheetx{display:none}
}
@media (max-width:599px){
  .split>.side.sheet{position:sticky;bottom:var(--stb,0px);z-index:3;max-height:52vh;max-height:52dvh;overflow:auto;overscroll-behavior:contain;background:var(--stone);padding-top:6px;box-shadow:0 -3px 0 var(--gold-dk)}
}
/* Titel: zweispaltig im Querformat */
.tgrid{display:grid;gap:12px}
.newsteaser{display:block;width:100%;text-align:left;border:0;cursor:pointer;background:var(--stone-lo);color:var(--parch);padding:9px 10px;font-family:var(--f-body);font-size:18px;line-height:1.1;box-shadow:inset 3px 0 0 var(--moss)}
.inapp{background:var(--stone-lo);padding:9px 10px;margin-bottom:10px;font-size:18px;line-height:1.15;box-shadow:inset 3px 0 0 var(--gold)}
.inapp b{display:block;font-family:var(--f-display);font-weight:400;font-size:8px;color:var(--gold);margin-bottom:4px}
.inapp .acts{justify-content:flex-start;margin-top:8px}
.newsteaser b{display:block;font-family:var(--f-display);font-weight:400;font-size:8px;color:var(--moss);margin-bottom:4px}
.badge{display:inline-block;font-family:var(--f-display);font-size:7px;background:var(--blood);color:var(--parch);padding:3px 4px;margin-left:6px;vertical-align:1px;animation:pulse2 .8s steps(2) infinite}
@media (min-width:600px) and (max-height:620px){.tgrid{grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);align-items:start}.tgrid .menu.two{grid-template-columns:1fr 1fr}}
/* Neuigkeiten */
.newsgrid{display:grid;gap:12px}
@media (min-width:760px){.newsgrid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}}
details.news{background:var(--stone-lo);margin-bottom:6px;padding:8px 10px}
details.news summary{cursor:pointer;font-size:19px;line-height:1.2;list-style:none}
details.news summary::-webkit-details-marker{display:none}
details.news summary b{font-family:var(--f-display);font-weight:400;font-size:9px;color:var(--gold);margin-right:6px}
details.news summary small{display:block;font-size:15px;color:var(--parch-dim)}
details.news ul{margin:8px 0 2px;padding:0;list-style:none}
details.news li{font-size:18px;line-height:1.15;margin-bottom:6px;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline}
.nk{font-family:var(--f-display);font-size:7px;color:var(--night);background:var(--c);padding:3px 4px;white-space:nowrap}
.soon{font-size:18px;line-height:1.15;margin-bottom:8px}
.soon b{display:block;font-family:var(--f-display);font-weight:400;font-size:8px;color:var(--rune);margin-bottom:3px}
/* Weltkarte: Info zum gewählten Ort direkt auf der Karte */
.mapinfo{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;max-width:min(52%,340px);display:flex;gap:10px;align-items:center;background:rgba(17,14,23,.88);padding:8px 10px;box-shadow:0 0 0 2px var(--night),0 0 0 3px var(--c,var(--gold));pointer-events:none}
.mapinfo img{width:28px;height:28px;object-fit:contain;image-rendering:pixelated;flex:none}
.mapinfo .nm{font-size:19px;line-height:1}
.mapinfo .st{font-size:16px;color:var(--parch-dim);line-height:1.05}
@media (orientation:portrait){.mapwrap{height:clamp(280px,calc(100vh - 370px),640px);height:clamp(280px,calc(100dvh - 370px),640px)}}
@media (max-width:599px){.tree{grid-template-columns:1fr}.branch h4{text-align:left;margin-top:6px}}
/* Touch: größere Ziele, lesbare Pixelschrift */
body.touch .btn{min-height:44px}
body.touch .btn.sm{min-height:38px;min-width:38px;padding:8px 10px}
body.touch .tab{min-height:40px;font-size:8px}
body.touch .opt{min-height:44px}
body.touch .sw{width:36px;height:36px}
body.touch .stats span,body.touch .pill,body.touch .tal b,body.touch .ach b,body.touch .wheel span,body.touch .say b,body.touch .tal .r{font-size:8px}
body.touch .node{width:44px;height:44px;margin:-22px 0 0 -22px}
body.touch .node.boss{width:54px;height:54px;margin:-27px 0 0 -27px}
body.touch .slot .u,body.touch .slot .n{font-size:8px}
body.touch .row{min-height:52px}
/* Wenig Höhe (Handy quer): alles enger */
@media (max-height:540px){
  #ov{padding-top:calc(env(safe-area-inset-top,0px) + 6px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px)}
  .panel{--pt:12px;--px:14px;width:min(760px,100%);box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--parch-dim),0 0 0 6px var(--night)}
  .panel.wide{width:min(1000px,100%)}
  h2{font-size:13px}
  h3{margin:10px 0 6px}
  .sub{font-size:17px;margin:4px 0 8px}
  .logo{font-size:30px;margin:0 0 8px;text-shadow:3px 3px 0 var(--blood),6px 6px 0 #000}
  .tag{font-size:17px;margin-bottom:10px}
  .menu{gap:8px;margin-bottom:8px}
  .btn{padding:9px 10px}
  .detail{padding:8px 10px;margin:6px 0}
  .say{padding:6px 8px;font-size:16px;margin-bottom:8px}
  .stats{gap:4px;margin-bottom:6px}
  .dlg{padding:10px;margin:6px 0 10px}
  .dlg p{font-size:19px}
  .mapwrap{height:clamp(170px,50vh,300px);margin:4px 0 6px}
  .gearslot .slot{width:54px;height:54px}
  .help{font-size:16px}
}
/* Wochen-Ereignis */
.weekbox{display:flex;gap:10px;align-items:center;background:var(--stone-lo);padding:9px 10px;margin-top:10px;font-size:18px;line-height:1.15;box-shadow:inset 3px 0 0 var(--c)}
.weekbox img{width:32px;height:32px;object-fit:contain;flex:none}
.weekbox b{display:block;font-family:var(--f-display);font-weight:400;font-size:8px;color:var(--parch-dim);margin-bottom:3px}
.weekbox .nm{font-family:var(--f-display);font-size:11px;margin-bottom:4px}
.weekbox small{display:block;font-size:15px;color:var(--parch-dim);margin-top:3px}
/* Große Schrift (Einstellungen) */
body.bigui .sub,body.bigui .row .nm,body.bigui .detail ul,body.bigui .cost,body.bigui .say,body.bigui .dlg p,body.bigui .tag,body.bigui details.news li,body.bigui .soon,body.bigui .weekbox,body.bigui .newsteaser,body.bigui .inapp{font-size:22px}
body.bigui .row .st,body.bigui .tal small,body.bigui .cls small,body.bigui .opt small,body.bigui .ach small,body.bigui .help,body.bigui .mapinfo .st{font-size:19px}
body.bigui .btn{font-size:11px}body.bigui .btn.sm{font-size:9px}body.bigui .foot.row .btn{font-size:9px}
.foot.row .btn{padding-left:4px;padding-right:4px}
body.bigui .tab,body.bigui .stats span,body.bigui .pill,body.bigui .tal b,body.bigui .ach b,body.bigui .wheel span{font-size:9px}
body.bigui h3{font-size:10px}body.bigui h2{font-size:17px}
</style>
</head>
